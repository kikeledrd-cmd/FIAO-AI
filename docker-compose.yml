services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: fiao
      POSTGRES_PASSWORD: fiao_dev
      POSTGRES_DB: fiao_dev
    ports:
      # 5433 externo: evita chocar con un PostgreSQL nativo local en 5432
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiao -d fiao_dev"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fiao_pg:/var/lib/postgresql

volumes:
  fiao_pg:
